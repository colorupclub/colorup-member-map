<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Member Map — Color Up Club</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.css" />
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/MarkerCluster.Default.css" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --maroon: #7A1C1C;
    --gold: #C9A84C;
    --cream: #F5F0E8;
    --felt: #1E4A2D;
    --border: #E8E4DC;
    --text: #1a1a1a;
    --text-muted: #777;
    --bg-soft: #F9F7F4;
  }

  body {
    font-family: 'Inter', sans-serif;
    background: var(--bg-soft);
    color: var(--text);
    min-height: 100vh;
  }

  .page-wrap { max-width: 1280px; margin: 0 auto; padding: 16px; }

  .map-container { width: 100%; }
  #map {
    width: 100%; height: 620px; border-radius: 12px; border: 1px solid var(--border);
  }

  .map-footnote {
    font-size: 11px; color: var(--text-muted); margin-top: 10px; line-height: 1.6;
    display: flex; align-items: flex-start; gap: 6px;
  }

  /* Legend */
  .legend {
    display: flex; gap: 16px; margin-bottom: 14px; flex-wrap: wrap;
  }
  .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--text-muted); }
  .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

  /* Popup styling */
  .leaflet-popup-content-wrapper { border-radius: 14px; }
  .leaflet-popup-content { margin: 18px 20px; }
  .popup-card { font-family: 'Inter', sans-serif; width: 220px; }
  .popup-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 14px; }
  .popup-name { font-size: 17px; font-weight: 600; color: var(--text); line-height: 1.25; }
  .popup-avatar {
    width: 46px; height: 46px; border-radius: 50%; flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; font-weight: 600; color: #fff; border: 2px solid var(--border);
  }
  .popup-actions { display: flex; flex-direction: column; gap: 8px; }
  .popup-btn {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    font-size: 13px; font-weight: 500; color: var(--text);
    padding: 9px 12px; border-radius: 20px; border: 1px solid var(--border);
    text-decoration: none; background: #fff;
  }
  .popup-btn:hover { border-color: var(--text-muted); }

  /* Cluster bubbles, sized and colored to match the brand instead of Leaflet's default green/yellow/orange */
  .cu-cluster {
    display: flex; align-items: center; justify-content: center;
    font-family: 'Inter', sans-serif; font-weight: 600; color: #fff;
    border-radius: 50%; border: 2px solid #fff;
    box-shadow: 0 1px 4px rgba(0,0,0,0.25);
  }
</style>
</head>
<body>

<div class="page-wrap">

  <div class="legend" id="legend-members">
    <div class="legend-item"><div class="legend-dot" style="background:#C0392B;"></div>Red member</div>
    <div class="legend-item"><div class="legend-dot" style="background:#27AE60;"></div>Green member</div>
    <div class="legend-item"><div class="legend-dot" style="background:#1a1a1a;"></div>Black member</div>
  </div>

  <div class="map-container">
    <div id="map"></div>
    <div class="map-footnote" id="map-footnote">
      <span>Pins show a general area only, never an exact address. Members choose to appear here from their profile settings.</span>
    </div>
  </div>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.markercluster/1.5.3/leaflet.markercluster.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script>
  // Set this to the "Publish to web" CSV link for the members sheet
  // (File -> Share -> Publish to web -> select the "members" tab -> CSV).
  // Leave blank to preview with sample data instead.
  var SHEET_CSV_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vSQ9DDQkZgozP2GweJ1ehXaxs5Tdtn1nHj_IS1J_y5caCPFChgyYZJ4u8HXuKFjdugLDC6gKyNw-UOP/pub?gid=0&single=true&output=csv';

  // Sample data, only used when SHEET_CSV_URL is blank or the fetch fails —
  // so this file still shows something while you're setting the real feed up.
  var sampleMembers = [
    { name: "DesertDiceDan", tier: "green", lat: 36.17, lng: -115.14 },
    { name: "ShootersShelly", tier: "green", lat: 39.53, lng: -119.81 },
    { name: "ComeOutKarl", tier: "red", lat: 33.45, lng: -112.07 },
    { name: "HardWayHannah", tier: "green", lat: 34.05, lng: -118.24 },
    { name: "PressPlayPete", tier: "red", lat: 32.72, lng: -117.16 },
    { name: "SixEightSara", tier: "green", lat: 39.74, lng: -104.99 },
    { name: "BoxcarBrian", tier: "red", lat: 41.88, lng: -87.63 },
    { name: "FieldBetFiona", tier: "green", lat: 42.33, lng: -83.05 },
    { name: "OddsOnOscar", tier: "red", lat: 39.36, lng: -74.42 },
    { name: "PointMakerPaula", tier: "green", lat: 40.71, lng: -74.01 },
    { name: "TableRailTom", tier: "red", lat: 42.36, lng: -71.06 },
    { name: "InsideBetIvy", tier: "green", lat: 30.40, lng: -88.89 },
    { name: "LayItLarry", tier: "red", lat: 34.68, lng: -90.38 },
    { name: "ComeBetCassie", tier: "green", lat: 29.95, lng: -90.07 },
    { name: "SevenOutSteve", tier: "red", lat: 39.10, lng: -94.58 },
    { name: "GoldenArmGina", tier: "green", lat: 30.27, lng: -97.74 },
    { name: "RailBirdRon", tier: "red", lat: 47.61, lng: -122.33 },
    { name: "MidnightMarge", tier: "green", lat: 27.95, lng: -82.46 }
  ];

  var tierColor = { green: "#27AE60", red: "#C0392B", black: "#1a1a1a" };

  var map = L.map('map', { zoomControl: true }).setView([39.5, -98.35], 4);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 18,
    attribution: '&copy; OpenStreetMap contributors'
  }).addTo(map);

  function memberMarker(m) {
    var initials = m.name.replace(/[^A-Za-z]/g, '').slice(0, 2).toUpperCase();
    var icon = L.divIcon({
      html: '<div class="cu-cluster" style="width:28px;height:28px;background:' + tierColor[m.tier] + ';font-size:10px;">' + initials + '</div>',
      className: '',
      iconSize: L.point(28, 28)
    });
    // Both buttons point at the real Circle profile page — there's no
    // confirmed separate "compose a message" URL, but the Message button
    // on that profile page does the same job in one extra click.
    var profileHref = m.profileUrl ? escapeHtml(m.profileUrl) : '#';
    return L.marker([m.lat, m.lng], { icon: icon }).bindPopup(
      '<div class="popup-card">' +
        '<div class="popup-top">' +
          '<div class="popup-name">' + escapeHtml(m.name) + '</div>' +
          '<div class="popup-avatar" style="background:' + tierColor[m.tier] + '">' + initials + '</div>' +
        '</div>' +
        '<div class="popup-actions">' +
          '<a class="popup-btn" href="' + profileHref + '" target="_blank" rel="noopener">View profile</a>' +
          '<a class="popup-btn" href="' + profileHref + '" target="_blank" rel="noopener">Message</a>' +
        '</div>' +
      '</div>'
    );
  }

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  var memberLayer = L.markerClusterGroup({
    maxClusterRadius: 50,
    spiderfyOnMaxZoom: true,
    showCoverageOnHover: false,
    iconCreateFunction: function (cluster) {
      var count = cluster.getChildCount();
      var size = count < 10 ? 34 : count < 50 ? 40 : 46;
      return L.divIcon({
        html: '<div class="cu-cluster" style="width:' + size + 'px;height:' + size + 'px;background:var(--maroon);font-size:' + (count < 10 ? 12 : 13) + 'px;">' + count + '</div>',
        className: '',
        iconSize: L.point(size, size)
      });
    }
  });

  function addMembers(list) {
    list.forEach(function (m) {
      if (!m.name || isNaN(m.lat) || isNaN(m.lng)) return;
      memberLayer.addLayer(memberMarker(m));
    });
    memberLayer.addTo(map);
  }

  if (SHEET_CSV_URL) {
    Papa.parse(SHEET_CSV_URL, {
      download: true,
      header: true,
      complete: function (results) {
        var rows = results.data.map(function (r) {
          return {
            name: r.display_name,
            tier: (r.tier || 'red').toLowerCase(),
            lat: parseFloat(r.lat),
            lng: parseFloat(r.lng),
            profileUrl: r.profile_url || ''
          };
        });
        addMembers(rows.length ? rows : sampleMembers);
      },
      error: function () {
        addMembers(sampleMembers);
      }
    });
  } else {
    addMembers(sampleMembers);
  }
</script>

</body>
</html>
